@if (latestProgress$ | async; as latestProgress) {
  <div style="display: flex; flex-direction: column; gap: 20px;">

    <!-- Progress bar -->
    <div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
        <span style="font-size: 0.85rem; color: rgba(0,0,0,0.6); font-weight: 500;">
          {{ latestProgress?.callerId }}
        </span>
        <span style="font-size: 1.1rem; font-weight: 600; color: #3f51b5;">
          {{ latestProgress?.curProgress + 2 }}%
        </span>
      </div>
      <mat-progress-bar
        mode="determinate"
        [value]="latestProgress?.curProgress + 2"
        style="height: 8px; border-radius: 4px;">
      </mat-progress-bar>
    </div>

    <!-- Cost display -->
    <div style="display: flex; justify-content: space-between; align-items: baseline;
                padding: 12px 16px; background: rgba(63,81,181,0.04); border-radius: 8px;">
      <span style="font-size: 0.85rem; color: rgba(0,0,0,0.6); font-weight: 500;">
        Current cost
      </span>
      <span style="font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums;">
        {{ latestProgress?.curCost | number:'1.2-2' }}
      </span>
    </div>

  </div>
} @else {
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0;">
    <mat-progress-bar mode="indeterminate" style="width: 100%; height: 8px; border-radius: 4px;">
    </mat-progress-bar>
    <span style="font-size: 0.85rem; color: rgba(0,0,0,0.45);">Waiting for optimization to start...</span>
  </div>
}
